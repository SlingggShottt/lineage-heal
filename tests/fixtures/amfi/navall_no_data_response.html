<script language="javascript" type="text/javascript">
    function ValidateForm() {
        var prefix = "ctl00_amfiHomeContent_";        
            if (document.forms[0].elements[prefix + "cmbMutualFund"].value=="0")
            {
                alert("Select Mutual Fund");
                document.forms[0].elements[prefix + "cmbMutualFund"].focus();
                return false;
            }
            else if (trim(document.forms[0].elements[prefix + "txtFrmDate"].value) == "") {
            alert("Enter " + document.getElementById(prefix + "lblFrmDate").innerHTML.replace('<U>N</U>AV', 'NAV'));
                document.forms[0].elements[prefix + "txtFrmDate"].focus();
                return false;
            }
            // substring function is used in below condition to get string 'NAV From' from string 'NAV From Date'
            // it is done since same label has three different dates depending on report option - NAV Date, NAV From Date & NAV First Date
            // using this function appropriate error msg will appear
            else if (validNdate(trim(document.forms[0].elements[prefix + "txtFrmDate"].value), (' ' + document.getElementById(prefix + "lblFrmDate").innerHTML.substring(0, document.getElementById(prefix + "lblFrmDate").innerHTML.lastIndexOf(" ")) + ' ').replace('<U>N</U>AV', 'NAV')))
            {
                document.forms[0].elements[prefix + "txtFrmDate"].focus();
                return false;
            }
            else if (document.forms[0].elements[prefix + "txtToDate"] && trim(document.forms[0].elements[prefix + "txtToDate"].value) == "") {
                alert("Enter NAV To Date");
                document.forms[0].elements[prefix + "txtToDate"].focus();
                return false;
            }
            else if (document.forms[0].elements[prefix + "txtToDate"] && validNdate(trim(document.forms[0].elements[prefix + "txtToDate"].value), ' NAV To '))
            {
                document.forms[0].elements[prefix + "txtToDate"].focus();
                return false;
            }
            else if (document.forms[0].elements[prefix + "txtToDate"] && !CheckDateRange(document.forms[0].elements[prefix + "txtFrmDate"].value, document.forms[0].elements[prefix + "txtToDate"].value))
            {  
                document.forms[0].elements[prefix + "txtFrmDate"].focus();
                return false;
            }
            else if (document.forms[0].elements[prefix + "txtToDate"] && !ValidateOneMonthPeriod(document.forms[0].elements[prefix + "txtFrmDate"].value, document.forms[0].elements[prefix + "txtToDate"].value)) 
            {
               	alert("The period should not exceed 30 days");
                document.forms[0].elements[prefix + "txtFrmDate"].focus();
                return false;
            }
            else
                return true;            
     }
</script>
