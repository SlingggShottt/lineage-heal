# pyproject.toml
# Project metadata, dependencies and tool configuration for LineageHeal.
# Keeping tool settings here means one file answers "how is this repo checked?".

[project]
name = "lineageheal"
version = "0.1.0"
description = "Self-healing lakehouse pipelines for Indian financial market data, powered by lineage-aware LLM agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Pinned to one minor version so local, CI and Docker runs behave identically.
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the task that first uses them, so every
# package in this list has a reason that can be traced to a backlog item.
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "dagster>=1.13.26",
    "dagster-dbt>=0.29.26",
    "dagster-webserver>=1.13.26",
    "dbt-duckdb>=1.11.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
lineageheal = "lineageheal.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[build-system]
# uv_build is versioned in lockstep with uv, so the range tracks the installed uv.
requires = ["uv_build>=0.12.21,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Ruff: formatting and linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming conventions
    "UP",      # modernise syntax
    "B",       # likely bugs
    "A",       # shadowed builtins
    "C4",      # comprehensions
    "SIM",     # simplifiable code
    "PT",      # pytest style
    "RUF",     # ruff-specific rules
    "S",       # security (bandit)
    "T20",     # no print(): library code logs with structlog
    "DTZ",     # no naive datetimes (style guide 3.2)
    "D",       # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests may assert freely, use obviously fake credentials (S105, S106), and test
# names already read as documentation.
# Alembic names revision files by number, which is not a valid module name.
"src/lineageheal/store/migrations/versions/*" = ["N999"]
"tests/**" = ["S101", "S105", "S106", "D100", "D101", "D102", "D103", "D104", "D107"]

# ---------------------------------------------------------------------------
# mypy: strict on the package, per CLAUDE.md
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
# Lets mypy understand pydantic models and settings classes.
plugins = ["pydantic.mypy"]

# boto3 and botocore ship no type information. We use a small slice of them behind the
# S3Client protocol in ingestion/object_stores.py instead of adding a stubs package.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs unit tests only; integration needs Docker services and
# the others are opt-in via `-m`. Style guide 3.7 defines the markers.
# importlib mode lets test files in different folders share a name without __init__.py files.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not integration and not e2e and not slow'"
# Two warnings from third-party code we cannot change are silenced, so they do not bury others:
# Dagster's compatibility layer reads a Pydantic attribute that Pydantic 2 deprecated, and
# dagster-dbt requires sqlglot[rs], whose sqlglotrs add-on is deprecated (revisit in LH-039).
filterwarnings = [
    "ignore:The `__fields__` attribute is deprecated:DeprecationWarning",
    "ignore:sqlglotrs is deprecated:DeprecationWarning",
]
markers = [
    "unit: fast, isolated tests (default)",
    "integration: needs Docker Compose services",
    "e2e: full-stack tests",
    "slow: long-running tests",
    "dbt: run real dbt builds; kept out of the coverage run because tracing dbt doubles their time",
]

[tool.coverage.run]
source = ["lineageheal"]
branch = true

[tool.coverage.report]
# NFR-MAINT-01
fail_under = 80
show_missing = true
